name: DeepSeek Token Monitor

on:
  schedule:
    # 每小时整点运行 (UTC 时间，北京时间 = UTC+8)
    # 避开整点高峰，选在每小时第 7 分钟
    - cron: "7 * * * *"
  # 也支持手动触发
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python bark_notifier.py
